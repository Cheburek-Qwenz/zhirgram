# Версии сверены с документацией 17.11.2026: AGP 9.5.1 (нужен Gradle 9.6.0, API до 37),
# Kotlin 2.4.21, BOM 2026.09.00. material3 1.5.0 тянет Compose 1.12: нужны AGP 9.1+ и compileSdk 37.
# В AGP 9 Kotlin встроен, плагин kotlin-android не нужен (остаётся только kotlin-compose).
# material3: по странице релизов на 17.11.2026 последняя 1.5.0-rc01 (4 ноя 2026).
# Если вышла 1.5.0 stable, поставь её. Expressive API публичные именно в линии 1.5.x
# (в 1.4.0 большая часть internal).
[versions]
agp = "9.5.1"
kotlin = "2.4.21"
composeBom = "2026.09.00"
material3 = "1.5.0-rc01"
activityCompose = "1.11.0"
lifecycle = "2.9.4"
coroutines = "1.10.2"
datastore = "1.1.7"
coreKtx = "1.17.0"

[libraries]
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
compose-foundation = { module = "androidx.compose.foundation:foundation" }
compose-animation = { module = "androidx.compose.animation:animation" }
# версия material3 задаётся явно, BOM указывает на stable
compose-material3 = { module = "androidx.compose.material3:material3", version.ref = "material3" }
compose-material-icons-extended = { module = "androidx.compose.material:material-icons-extended" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "coreKtx" }
androidx-datastore-preferences = { module = "androidx.datastore:datastore-preferences", version.ref = "datastore" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
