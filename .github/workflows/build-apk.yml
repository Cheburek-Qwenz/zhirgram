name: Build APK

# Перед первым запуском один раз запусти "Build TDLib" (он кладёт в Releases архив tdlib-latest).
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write   # нужен для публикации в Releases по тегу

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # В репозитории нет gradlew (wrapper-jar бинарный), поэтому ставим Gradle сами.
      # Версия под AGP 8.13. Если добавишь gradlew, убери gradle-version и вызывай ./gradlew.
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Android SDK
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: TDLib из Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download tdlib-latest -p tdlib-android.zip -D "$RUNNER_TEMP"
          unzip -o "$RUNNER_TEMP/tdlib-android.zip" -d app/src/main
          ls app/src/main/java/org/drinkless/tdlib app/src/main/jniLibs/arm64-v8a

      - name: Ключ подписи из секрета
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "STORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          fi

      - name: Сборка release
        env:
          TG_APP_ID: ${{ secrets.TG_APP_ID }}
          TG_APP_HASH: ${{ secrets.TG_APP_HASH }}
          STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle :app:assembleRelease --stacktrace

      # Страховка от тихой поломки R8: классы TDLib должны остаться с оригинальными именами
      - name: Проверка, что R8 не переименовал TDLib
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          mkdir -p "$RUNNER_TEMP/dex" && unzip -o -q "$APK" 'classes*.dex' -d "$RUNNER_TEMP/dex"
          grep -l 'org/drinkless/tdlib/TdApi' "$RUNNER_TEMP"/dex/classes*.dex
          unzip -l "$APK" | grep libtdjni.so

      - uses: actions/upload-artifact@v4
        with:
          name: zhirgram-apk
          path: app/build/outputs/apk/release/*.apk

      - name: Release по тегу
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/*.apk
